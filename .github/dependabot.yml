version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/tools/observer"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(images): "

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps): "
    groups:
      go-modules:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "github.com/multigres/multigres"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci): "
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
