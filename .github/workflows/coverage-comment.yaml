###========================================
##  Coverage PR Comment (via workflow_run)
#==========================================
# This workflow runs after the CI workflow completes and posts the
# test coverage report as a PR comment. It uses `workflow_run` so that
# it always executes in the context of the base repository with write
# permissions — this is required for fork-based PRs where the
# GITHUB_TOKEN is read-only.
#
# Ref: https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#workflow_run

name: Coverage comment

on: # zizmor: ignore[dangerous-triggers] No checkout or execution of PR code; bounded data is checked against the triggering PR before commenting.
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Post coverage comment
    runs-on: ubuntu-latest
    # Only run when the triggering workflow was a PR and produced artifacts.
    if: >-
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download coverage artifact
        id: download
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            // List artifacts for the triggering workflow run
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const match = artifacts.data.artifacts.find(a => a.name === 'coverage-report');
            if (!match) {
              core.setOutput('found', 'false');
              console.log('No coverage-report artifact found — skipping.');
              return;
            }
            if (match.size_in_bytes > 1024 * 1024) {
              throw new Error('Coverage artifact exceeds 1 MiB');
            }
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: match.id,
              archive_format: 'zip',
            });
            fs.writeFileSync('/tmp/coverage-report.zip', Buffer.from(download.data));
            core.setOutput('found', 'true');

      - name: Extract artifact
        if: steps.download.outputs.found == 'true'
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          destination = pathlib.Path('/tmp/coverage-artifact')
          destination.mkdir()
          names = {'pr_number', 'threshold', 'new_coverage', 'prev_coverage', 'coverage_report.txt'}
          with zipfile.ZipFile('/tmp/coverage-report.zip') as archive:
              entries = archive.infolist()
              if len(entries) != len(names) or {entry.filename for entry in entries} != names:
                  raise ValueError('Unexpected or duplicate coverage artifact entries')
              for entry in entries:
                  if entry.file_size > 128 * 1024:
                      raise ValueError('Coverage entry exceeds 128 KiB')
                  # Write only allowlisted names; never extract paths or symlinks.
                  (destination / entry.filename).write_bytes(archive.read(entry))
          PY

      - name: Post PR comment
        if: steps.download.outputs.found == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs/promises')

            // 1. Read artifact data
            const number = (await fs.readFile('/tmp/coverage-artifact/pr_number', 'utf8')).trim();
            if (!/^[1-9][0-9]*$/.test(number)) throw new Error('Invalid PR number');
            const prNumber = Number(number);
            const run = context.payload.workflow_run;
            const { data: pr } = await github.rest.pulls.get({...context.repo, pull_number: prNumber});
            if (pr.state !== 'open' || pr.head.sha !== run.head_sha ||
                pr.head.repo?.id !== run.head_repository.id ||
                pr.base.repo.id !== context.payload.repository.id ||
                (run.pull_requests.length && !run.pull_requests.some(p => p.number === prNumber))) {
              throw new Error('Coverage artifact does not match the triggering PR revision');
            }
            const threshold = (await fs.readFile('/tmp/coverage-artifact/threshold', 'utf8')).trim();
            const newCovStr = (await fs.readFile('/tmp/coverage-artifact/new_coverage', 'utf8')).trim();
            const prevCovStr = (await fs.readFile('/tmp/coverage-artifact/prev_coverage', 'utf8')).trim();

            let reportContent = "No coverage report generated (Build likely failed).";
            try {
              reportContent = await fs.readFile('/tmp/coverage-artifact/coverage_report.txt', 'utf8');
            } catch (e) {
              console.log("Could not read coverage report file:", e.message);
            }
            // Artifact contents are untrusted text, never Markdown or mentions.
            reportContent = reportContent.replaceAll('`', "'").replaceAll('@', '@\u200b');
            for (const value of [threshold, newCovStr, prevCovStr]) {
              if (value && value !== 'unknown' && !/^[0-9]+(?:\.[0-9]+)?$/.test(value)) {
                throw new Error('Invalid coverage percentage');
              }
            }

            // 2. Calculate status
            const thresholdVal = parseFloat(threshold) || 0;
            const newCov = parseFloat(newCovStr);

            let overallStatus = "⚠️ SKIPPED (Build Failed?)";
            if (!isNaN(newCov)) {
              if (thresholdVal > newCov) {
                overallStatus = `❌ FAIL: Coverage (${newCov}%) < Threshold (${thresholdVal}%)`;
              } else {
                overallStatus = "✅ PASS";
              }
            }

            // 3. Build comment body
            const comment = `### 🔬 Go Test Coverage Report

            #### Summary

            | Coverage Type          | Result                                 |
            | ---------------------- | -------------------------------------- |
            | Threshold              | ${thresholdVal}%                       |
            | Previous Test Coverage | ${prevCovStr || 'Unknown'}%            |
            | New Test Coverage      | ${newCovStr || 'Unknown'}%             |

            #### Status

            ${overallStatus}

            #### Detail

            <details><summary>Show New Coverage</summary>

            \`\`\`
            ${reportContent}
            \`\`\`

            </details>
            `;

            // 4. Minimize old bot comments
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: prNumber,
            });
            const botComments = comments.filter(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Go Test Coverage Report')
            );
            for (const botComment of botComments) {
              const query = `mutation {
                minimizeComment(input: {classifier: OUTDATED, subjectId: "${botComment.node_id}"}) {
                  clientMutationId
                }
              }`
              await github.graphql(query)
            }

            // 5. Create new comment
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: prNumber,
              body: comment,
            })
