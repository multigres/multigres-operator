name: Build & Release

on:
  workflow_call:
    inputs:
      architectures:
        description: A JSON list of GOARCH values for which to build
        default: '["amd64", "arm64"]'
        required: false
        type: string
      push-container-image:
        description: Whether to push the resulting container image to the registry
        default: false
        required: false
        type: boolean
      additional-tags:
        description: Space-separated list of additional tags to apply via imagetools (e.g. "current latest v1.2.3")
        default: ""
        required: false
        type: string
      generate-manifests:
        description: Whether to generate and upload install manifests as workflow artifacts
        default: false
        required: false
        type: boolean
      manifest-image-ref:
        description: The image reference to embed in manifests (e.g. ghcr.io/.../multigres-operator:abc123)
        default: ""
        required: false
        type: string

permissions:
  contents: read

jobs:
  test-go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests
        run: go test ./... -coverprofile=./cover.out -covermode=atomic -coverpkg=./...

      - name: Run observer tests against current operator API
        working-directory: tools/observer
        run: go test -mod=readonly ./...

  build-scan-push-container:
    needs: [ test-go ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker for multi-platform
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ join(fromJson(inputs.architectures), ',linux/') }}
          load: true
          push: false
          tags: "ghcr.io/${{ github.repository }}:${{ github.sha }}"
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=oci,dest=container-image.tar
          build-args: |
            VERSION=${{ env.SHORT_SHA }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Push to registry (sha)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          docker push "$IMAGE:$IMAGE_SHA"

      # grype requires that the container image be pushed already because
      # the scanner runs in a container with a different local registry
      - name: Scan final image with grype
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        continue-on-error: true
        with:
          cache-db: true
          image: "ghcr.io/${{ github.repository }}:${{ github.sha }}"
          output-file: grype.sarif
          severity-cutoff: high
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: grype.sarif
      - name: Check success or failure
        if: ${{ steps.scan.outcome == 'failure' }}
        run: |-
          jq '.runs[0].results | map(select(.level == "error"))' grype.sarif
          exit 1

      - name: Apply additional tags
        if: ${{ inputs.additional-tags != '' }}
        env:
          ADDITIONAL_TAGS: ${{ inputs.additional-tags }}
          IMAGE: ghcr.io/${{ github.repository }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          for TAG in $ADDITIONAL_TAGS; do
            docker buildx imagetools create \
              --tag "$IMAGE:$TAG" \
              "$IMAGE:$IMAGE_SHA"
          done

  validate-installer:
    needs: [ test-go ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate install manifests
        run: make build-installer

  generate-manifests:
    if: ${{ inputs.generate-manifests }}
    needs: [ build-scan-push-container ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate install manifests
        env:
          MANIFEST_IMAGE_REF: ${{ inputs.manifest-image-ref }}
        run: make build-installer IMG="$MANIFEST_IMAGE_REF"

      - name: Upload install manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-manifests
          path: |
            dist/install.yaml
            dist/install-crds.yaml
            dist/install-rbac.yaml
            dist/install-certmanager.yaml
            dist/install-observability.yaml
