name: Nightly upstream compatibility

on:
# Poll once after the upstream 05:00 UTC build. The run selects only a fully
# successful nightly build; an in-progress build is never consumed. A SHA
# older than the last promoted revision is skipped. The same SHA is retested
# because the Supabase image or operator revision may have changed.
# Manual runs remain diagnostic and never promote or checkpoint a revision.
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      upstream-sha:
        description: Full multigres commit SHA (empty uses the latest successful nightly build)
        required: false
        default: ""
        type: string
      operator-ref:
        description: Operator ref to test (useful for intentionally testing an incompatible pair)
        required: false
        default: main
        type: string
      supabase-image:
        description: Supabase Postgres image pinned by digest (empty uses the SUPABASE_POSTGRES_IMAGE repository variable)
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: nightly-upstream-compatibility
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve immutable nightly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # Read prior canary runs and green-state artifacts.
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short-sha: ${{ steps.resolve.outputs.short_sha }}
      operator-ref: ${{ steps.resolve.outputs.operator_ref }}
      operator-sha: ${{ steps.resolve.outputs.operator_sha }}
      nightly-run-id: ${{ steps.resolve.outputs.nightly_run_id }}
      nightly-run-attempt: ${{ steps.resolve.outputs.nightly_run_attempt }}
      last-green-sha: ${{ steps.last-green.outputs.sha }}
      should-run: ${{ steps.gate.outputs.should_run }}
      multigres-image: ${{ steps.resolve.outputs.multigres_image }}
      pgctld-image: ${{ steps.resolve.outputs.pgctld_image }}
      multiadmin-web-image: ${{ steps.resolve.outputs.multiadmin_web_image }}
    steps:
      - name: Find last green canary
        id: last-green
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prefix = 'nightly-compatibility-promoted-';
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'nightly-compatibility.yaml',
                status: 'success',
                per_page: 100,
              },
            );
            const canonicalRuns = runs
              .filter((run) => run.event === 'schedule' && run.head_branch === 'main' &&
                run.repository.full_name === 'multigres/multigres-operator')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (const run of canonicalRuns) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              const artifact = data.artifacts.find((candidate) =>
                !candidate.expired &&
                candidate.name.startsWith(prefix) &&
                /^[0-9a-f]{40}$/.test(candidate.name.slice(prefix.length))
              );
              if (artifact) {
                core.setOutput('sha', artifact.name.slice(prefix.length));
                return;
              }
            }
            core.setOutput('sha', '');

      - name: Resolve upstream SHA
        id: resolve
        env:
          INPUT_SHA: ${{ inputs.upstream-sha }}
          INPUT_OPERATOR_REF: ${{ inputs.operator-ref }}
        run: |
          sha="$INPUT_SHA"
          # Resolve one completed scheduled build, keeping its identity alongside
          # the source SHA. Manual SHA overrides still cannot enter promotion.
          nightly='{}'
          if [ -z "$sha" ]; then
            nightly="$(
              curl --fail --retry 3 --silent --show-error \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/multigres/multigres/actions/workflows/nightly-build.yml/runs?branch=main&event=schedule&status=success&per_page=1" |
                jq -ec '.workflow_runs[0] | select(.conclusion == "success" and .head_branch == "main" and .event == "schedule")'
            )"
            sha="$(jq -er '.head_sha' <<< "$nightly")"
          fi

          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::Expected a full upstream commit SHA, got '$sha'"; exit 1; }
          short_sha="${sha:0:7}"
          operator_ref="${INPUT_OPERATOR_REF:-main}"
          [[ "$operator_ref" =~ ^[A-Za-z0-9._/@+-]+$ ]] ||
            { echo "::error::Invalid operator ref '$operator_ref'"; exit 1; }

          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            operator_sha="$GITHUB_SHA"
          else
            operator_sha="$(
              curl --fail --retry 3 --silent --show-error \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$operator_ref" |
                jq -er '.sha'
            )"
          fi
          [[ "$operator_sha" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::Expected a full operator SHA"; exit 1; }

          {
            echo "sha=$sha"
            echo "short_sha=$short_sha"
            echo "operator_ref=$operator_ref"
            echo "operator_sha=$operator_sha"
            echo "nightly_run_id=$(jq -r '.id // empty' <<< "$nightly")"
            echo "nightly_run_attempt=$(jq -r '.run_attempt // empty' <<< "$nightly")"
            echo "multigres_image=ghcr.io/multigres/multigres:nightly-sha-$sha"
            echo "pgctld_image=ghcr.io/multigres/pgctld:nightly-sha-$sha"
            echo "multiadmin_web_image=ghcr.io/multigres/multiadmin-web:nightly-sha-$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Validate and gate upstream SHA
        id: gate
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          OPERATOR_REF: ${{ steps.resolve.outputs.operator_ref }}
          EVENT_NAME: ${{ github.event_name }}
          LAST_GREEN_SHA: ${{ steps.last-green.outputs.sha }}
        run: |
          relation="$(
            curl --fail --retry 3 --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/multigres/multigres/compare/main...$SHA" |
              jq -r '.status'
          )"
          [[ "$relation" =~ ^(identical|behind)$ ]] ||
            { echo "::error::SHA is not on multigres/main"; exit 1; }

          should_run=true
          if [ "$EVENT_NAME" != "workflow_dispatch" ] &&
             [ "$OPERATOR_REF" = "main" ] &&
             [ -n "$LAST_GREEN_SHA" ]; then
            relation="$(
              curl --fail --retry 3 --silent --show-error \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/multigres/multigres/compare/$LAST_GREEN_SHA...$SHA" |
                jq -r '.status'
            )"
            case "$relation" in
              behind)
                should_run=false
                ;;
              identical | ahead)
                ;;
              *)
                echo "::error::Upstream SHA diverges from the last green SHA"
                exit 1
                ;;
            esac
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Record skipped stale request
        if: steps.gate.outputs.should_run == 'false'
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: echo "Skipping $SHA because it is older than the last promoted SHA."

  preflight:
    name: Verify immutable nightly
    needs: resolve
    if: needs.resolve.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: read # Authenticate to GHCR for OCI verification.
    outputs:
      multigres-image: ${{ steps.images.outputs.multigres_image }}
      pgctld-image: ${{ steps.images.outputs.pgctld_image }}
      multiadmin-web-image: ${{ steps.images.outputs.multiadmin_web_image }}
    steps:
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Resolve immutable nightly image digests
        id: images
        env:
          MULTIGRES_IMAGE: ${{ needs.resolve.outputs.multigres-image }}
          PGCTLD_IMAGE: ${{ needs.resolve.outputs.pgctld-image }}
          MULTIADMIN_WEB_IMAGE: ${{ needs.resolve.outputs.multiadmin-web-image }}
        run: |
          resolve_digest() {
            local image="$1"
            local digest
            digest="$(
              docker buildx imagetools inspect "$image" \
                --format '{{json .Manifest}}' |
                jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))'
            )" || return 1
            echo "${image%:*}@$digest"
          }

          multigres_image="$(resolve_digest "$MULTIGRES_IMAGE")"
          pgctld_image="$(resolve_digest "$PGCTLD_IMAGE")"
          multiadmin_web_image="$(resolve_digest "$MULTIADMIN_WEB_IMAGE")"
          {
            echo "multigres_image=$multigres_image"
            echo "pgctld_image=$pgctld_image"
            echo "multiadmin_web_image=$multiadmin_web_image"
          } >> "$GITHUB_OUTPUT"

      - name: Verify both supported architectures
        env:
          MULTIGRES_IMAGE: ${{ steps.images.outputs.multigres_image }}
          PGCTLD_IMAGE: ${{ steps.images.outputs.pgctld_image }}
          MULTIADMIN_WEB_IMAGE: ${{ steps.images.outputs.multiadmin_web_image }}
        run: |
          for image in "$MULTIGRES_IMAGE" "$PGCTLD_IMAGE" "$MULTIADMIN_WEB_IMAGE"; do
            docker buildx imagetools inspect "$image" --raw |
              jq -e '
                [.manifests[] | select(.platform.os == "linux") | .platform.architecture] |
                (index("amd64") != null) and (index("arm64") != null)
              ' > /dev/null
          done

      - name: Verify nightly image provenance
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ needs.resolve.outputs.sha }}
          MULTIGRES_IMAGE: ${{ steps.images.outputs.multigres_image }}
          PGCTLD_IMAGE: ${{ steps.images.outputs.pgctld_image }}
          MULTIADMIN_WEB_IMAGE: ${{ steps.images.outputs.multiadmin_web_image }}
        run: |
          verify_image() {
            local image="$1"
            local expected_name="${image%@*}"
            local verification
            verification="$(
              gh attestation verify "oci://$image" \
                --repo multigres/multigres \
                --bundle-from-oci \
                --signer-workflow \
                  multigres/multigres/.github/workflows/nightly-build.yml \
                --source-ref refs/heads/main \
                --source-digest "$UPSTREAM_SHA" \
                --deny-self-hosted-runners \
                --format json
            )"
            jq -e --arg expected_name "$expected_name" '
              any(
                .[];
                any(
                  .verificationResult.statement.subject[]?;
                  .name == $expected_name
                )
              )
            ' <<< "$verification" > /dev/null ||
              {
                echo "::error::Attestation subject does not match $expected_name"
                return 1
              }
          }

          verify_image "$MULTIGRES_IMAGE"
          verify_image "$PGCTLD_IMAGE"
          verify_image "$MULTIADMIN_WEB_IMAGE"

  supabase:
    name: Verify Supabase image
    needs: [resolve, preflight]
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Select Supabase image
        id: image
        env:
          INPUT_IMAGE: ${{ inputs.supabase-image }}
          DEFAULT_IMAGE: ${{ vars.SUPABASE_POSTGRES_IMAGE }}
        run: |
          image="${INPUT_IMAGE:-$DEFAULT_IMAGE}"
          [ -n "$image" ] ||
            { echo "::error::Set the SUPABASE_POSTGRES_IMAGE repository variable to the Supabase Postgres image, pinned by digest"; exit 1; }
          [[ "$image" =~ ^[a-z0-9-]+(\.[a-z0-9-]+)+(:[0-9]+)?/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] ||
            { echo "::error::Expected a fully qualified Supabase image pinned by digest, got '$image'"; exit 1; }
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Compare pgbackrest versions
        env:
          SUPABASE_IMAGE: ${{ steps.image.outputs.image }}
          MULTIPOOLER_IMAGE: ${{ needs.preflight.outputs.multigres-image }}
        run: |
          # pgctld in the Supabase image and multipooler both run pgbackrest
          # against the same backup repository, so the versions must match.
          supabase="$(docker run --rm --entrypoint pgbackrest "$SUPABASE_IMAGE" version)"
          multipooler="$(docker run --rm --entrypoint pgbackrest "$MULTIPOOLER_IMAGE" version)"
          for version in "$supabase" "$multipooler"; do
            [[ "$version" =~ ^pgBackRest\ [0-9] ]] ||
              { echo "::error::Unexpected pgbackrest version output '$version'"; exit 1; }
          done
          [ "$supabase" = "$multipooler" ] ||
            { echo "::error::pgbackrest differs: Supabase image has '$supabase', multipooler image has '$multipooler'"; exit 1; }
          echo "Both images run $supabase."

  e2e:
    name: Canary e2e
    needs: [resolve, preflight]
    if: needs.preflight.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/_reusable-e2e.yaml
    with:
      ref: ${{ needs.resolve.outputs.operator-sha }}
      timeout-minutes: 30
      postgres-image: ${{ needs.preflight.outputs.pgctld-image }}
      multiadmin-image: ${{ needs.preflight.outputs.multigres-image }}
      multiadmin-web-image: ${{ needs.preflight.outputs.multiadmin-web-image }}
      multiorch-image: ${{ needs.preflight.outputs.multigres-image }}
      multipooler-image: ${{ needs.preflight.outputs.multigres-image }}
      multigateway-image: ${{ needs.preflight.outputs.multigres-image }}

  e2e-supabase:
    name: Supabase canary e2e
    needs: [resolve, preflight, supabase]
    if: needs.preflight.result == 'success' && needs.supabase.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/_reusable-e2e.yaml
    with:
      ref: ${{ needs.resolve.outputs.operator-sha }}
      timeout-minutes: 30
      postgres-image: ${{ needs.supabase.outputs.image }}
      artifact-suffix: supabase
      multiadmin-image: ${{ needs.preflight.outputs.multigres-image }}
      multiadmin-web-image: ${{ needs.preflight.outputs.multiadmin-web-image }}
      multiorch-image: ${{ needs.preflight.outputs.multigres-image }}
      multipooler-image: ${{ needs.preflight.outputs.multigres-image }}
      multigateway-image: ${{ needs.preflight.outputs.multigres-image }}

  report:
    name: Record compatibility result
    needs: [resolve, preflight, supabase, e2e, e2e-supabase]
    if: >-
      always() &&
      (needs.resolve.result != 'success' ||
       needs.resolve.outputs.should-run == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Read the last promotion record.
      issues: write # Create or update the compatibility tracking issues.
    steps:
      - name: Update tracking issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          SUPABASE_RESULT: ${{ needs.supabase.result }}
          SUPABASE_E2E_RESULT: ${{ needs.e2e-supabase.result }}
          SUPABASE_IMAGE: ${{ needs.supabase.outputs.image }}
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_SHA: ${{ needs.resolve.outputs.sha }}
          SHORT_SHA: ${{ needs.resolve.outputs.short-sha }}
          LAST_GREEN_SHA: ${{ needs.resolve.outputs.last-green-sha }}
          OPERATOR_REF: ${{ needs.resolve.outputs.operator-ref }}
          OPERATOR_SHA: ${{ needs.resolve.outputs.operator-sha }}
          IMAGE_TAG: nightly-sha-${{ needs.resolve.outputs.sha }}
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const runUrl =
              `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const passed = (...names) => names.every((name) => process.env[name] === 'success');
            const vanillaPassed = passed('RESOLVE_RESULT', 'PREFLIGHT_RESULT', 'E2E_RESULT');
            const supabasePassed = passed('SUPABASE_RESULT', 'SUPABASE_E2E_RESULT');
            const canonicalRun =
              process.env.OPERATOR_REF === 'main' &&
              process.env.EVENT_NAME === 'schedule' &&
              context.ref === 'refs/heads/main' &&
              context.repo.owner === 'multigres' &&
              context.repo.repo === 'multigres-operator';
            const upstreamSha = process.env.UPSTREAM_SHA || 'unknown';
            const shortSha = process.env.SHORT_SHA || 'unknown';
            const operatorSha = process.env.OPERATOR_SHA || '';
            const upstreamLink = process.env.UPSTREAM_SHA
              ? `[multigres@${upstreamSha}](https://github.com/multigres/multigres/commit/${upstreamSha})`
              : 'an unresolved upstream SHA';
            const trackers = {
              upstream: {
                marker: '<!-- nightly-compatibility-canary -->',
                label: 'upstream-compatibility',
                description: 'Compatibility impact from an upstream Multigres change',
              },
              supabase: {
                marker: '<!-- nightly-compatibility-supabase -->',
                label: 'supabase-compatibility',
                description: 'Nightly Multigres images fail with the Supabase Postgres image',
              },
            };

            async function find(tracker) {
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                ...repo,
                state: 'open',
                labels: tracker.label,
                per_page: 100,
              });
              return issues.find(
                (issue) => !issue.pull_request && issue.body?.includes(tracker.marker),
              );
            }

            // Diagnostic skew runs must not advance or clear the canonical
            // main-vs-nightly compatibility state.
            async function recover(tracker, message) {
              if (!canonicalRun) {
                core.info(
                  `Diagnostic ${process.env.EVENT_NAME} run; ` +
                  `leaving the ${tracker.label} issue unchanged.`,
                );
                return;
              }
              const tracking = await find(tracker);
              if (!tracking) return;
              await github.rest.issues.createComment({
                ...repo,
                issue_number: tracking.number,
                body: `${message} [Canary run](${runUrl})`,
              });
              await github.rest.issues.update({
                ...repo,
                issue_number: tracking.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

            // One open issue per tracker, so one breakage produces one issue.
            async function fail(tracker, { stage, title, body }) {
              try {
                await github.rest.issues.getLabel({ ...repo, name: tracker.label });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  ...repo,
                  name: tracker.label,
                  color: 'd73a4a',
                  description: tracker.description,
                });
              }
              const tracking = await find(tracker);
              body = `${tracker.marker}\n${body}`;
              if (tracking) {
                await github.rest.issues.update({ ...repo, issue_number: tracking.number, title, body });
                await github.rest.issues.createComment({
                  ...repo,
                  issue_number: tracking.number,
                  body:
                    `Still failing during ${stage} at \`${upstreamSha}\`. ` +
                    `[Latest run](${runUrl})`,
                });
              } else {
                await github.rest.issues.create({ ...repo, title, body, labels: [tracker.label] });
              }
            }

            if (supabasePassed) {
              await recover(trackers.supabase, `✅ Supabase Postgres lane recovered at ${upstreamLink}.`);
            }

            if (!vanillaPassed) {
              // A vanilla failure usually breaks the Supabase lane too, so it is
              // reported once, on the upstream issue.
              const stage =
                process.env.RESOLVE_RESULT !== 'success' ? 'SHA resolution/validation' :
                process.env.PREFLIGHT_RESULT !== 'success' ? 'nightly image preflight' :
                'vanilla operator e2e';
              const range =
                process.env.LAST_GREEN_SHA && process.env.UPSTREAM_SHA
                ? `[${process.env.LAST_GREEN_SHA.slice(0, 7)}...${shortSha}]` +
                  `(https://github.com/multigres/multigres/compare/` +
                  `${process.env.LAST_GREEN_SHA}...${upstreamSha})`
                : 'Unavailable (this is the first recorded canary result)';
              const supabaseLane = supabasePassed
                ? 'passed'
                : `did not pass (image check: ${process.env.SUPABASE_RESULT || 'missing'}, ` +
                  `e2e: ${process.env.SUPABASE_E2E_RESULT || 'missing'})`;
              await fail(trackers.upstream, {
                stage,
                title: `Nightly compatibility canary failing at multigres/${shortSha}`,
                body: `## Nightly compatibility failure

            The nightly compatibility canary failed during **${stage}** for
            ${upstreamLink}.

            - **Upstream image tag:** \`${process.env.IMAGE_TAG}\`
            - **Operator ref:** \`${process.env.OPERATOR_REF}\`
            - **Range since last green:** ${range}
            - **Supabase lane:** ${supabaseLane}
            - **Latest failed run:** [GitHub Actions](${runUrl})

            This issue is updated on consecutive nightly failures and closed by the
            first green vanilla lane, so one compatibility breakage produces one issue.
            `,
              });
              return;
            }

            await recover(trackers.upstream, `✅ Compatibility recovered at ${upstreamLink}.`);
            if (supabasePassed) return;

            // Compare with the last promotion so triage can see whether Multigres,
            // the operator, or the Supabase image changed.
            let last = null;
            try {
              const { data } = await github.rest.repos.getContent({
                ...repo,
                path: 'config/runtime-image-promotion.json',
                ref: operatorSha || 'main',
              });
              last = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const compare = (name, base, head) => base && head
              ? `[${base.slice(0, 7)}...${head.slice(0, 7)}]` +
                `(https://github.com/multigres/${name}/compare/${base}...${head})`
              : 'unavailable';
            const image = process.env.SUPABASE_IMAGE;
            const imageChange =
              !last?.supabase?.image ? 'no earlier Supabase result recorded' :
              !image ? 'not resolved in this run' :
              last.supabase.image === image ? 'unchanged' :
              `changed from \`${last.supabase.image}\``;
            const stage = process.env.SUPABASE_RESULT !== 'success'
              ? 'Supabase image verification'
              : 'Supabase operator e2e';
            await fail(trackers.supabase, {
              stage,
              title: `Supabase Postgres lane failing at multigres/${shortSha}`,
              body: `## Supabase Postgres lane failure

            The Supabase Postgres lane failed during **${stage}** for ${upstreamLink}.
            The vanilla lane passed. Promotion is blocked until this lane passes.

            - **Supabase image:** \`${image || 'unresolved'}\`
            - **Operator commit:** \`${operatorSha || 'unknown'}\`
            - **Changes since the last promotion:**
              - Multigres: ${compare('multigres', last?.upstream_sha, process.env.UPSTREAM_SHA)}
              - Operator: ${compare('multigres-operator', last?.operator_sha, operatorSha)}
              - Supabase image: ${imageChange}
            - **Latest failed run:** [GitHub Actions](${runUrl})

            If only one of these changed, start there. Cluster logs from the e2e are in
            the run's \`kind-logs-all-supabase\` artifact.

            This issue is updated on consecutive failures and closed by the first green
            Supabase lane on main.
            `,
            });

      - name: Fail when canary failed
        if: >-
          always() &&
          (needs.resolve.result != 'success' ||
           needs.preflight.result != 'success' ||
           needs.e2e.result != 'success' ||
           needs.supabase.result != 'success' ||
           needs.e2e-supabase.result != 'success')
        env:
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          SUPABASE_RESULT: ${{ needs.supabase.result }}
          SUPABASE_E2E_RESULT: ${{ needs.e2e-supabase.result }}
        run: |
          echo "::error::Canary results: resolve=$RESOLVE_RESULT preflight=$PREFLIGHT_RESULT e2e=$E2E_RESULT supabase=$SUPABASE_RESULT supabase-e2e=$SUPABASE_E2E_RESULT"
          exit 1

  promote:
    name: Promote verified runtime defaults
    needs: [resolve, preflight, supabase, e2e, e2e-supabase]
    if: >-
      github.repository == 'multigres/multigres-operator' &&
      github.event_name == 'schedule' &&
      github.ref == 'refs/heads/main' &&
      needs.resolve.outputs.operator-ref == 'main' &&
      needs.resolve.outputs.should-run == 'true' &&
      needs.preflight.result == 'success' &&
      needs.e2e.result == 'success' &&
      needs.supabase.result == 'success' &&
      needs.e2e-supabase.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out tested operator revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.operator-sha }}
          persist-credentials: false

      # An App token triggers PR checks; PRs authored with GITHUB_TOKEN do not.
      - name: Generate promotion App token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.MULTIGRES_BOT_APP_ID }}
          private-key: ${{ secrets.MULTIGRES_BOT_APP_PRIVATE_KEY }}
          owner: multigres
          repositories: multigres-operator
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update promotion PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          UPSTREAM_SHA: ${{ needs.resolve.outputs.sha }}
          OPERATOR_SHA: ${{ needs.resolve.outputs.operator-sha }}
          SUPABASE_IMAGE: ${{ needs.supabase.outputs.image }}
          VANILLA_RESULT: ${{ needs.e2e.result }}
          SUPABASE_RESULT: ${{ needs.e2e-supabase.result }}
          NIGHTLY_RUN_ID: ${{ needs.resolve.outputs.nightly-run-id }}
          NIGHTLY_RUN_ATTEMPT: ${{ needs.resolve.outputs.nightly-run-attempt }}
          MULTIGRES_IMAGE: ${{ needs.preflight.outputs.multigres-image }}
          PGCTLD_IMAGE: ${{ needs.preflight.outputs.pgctld-image }}
          MULTIADMIN_WEB_IMAGE: ${{ needs.preflight.outputs.multiadmin-web-image }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const { promote, recordFromEnv } = require('./scripts/promote-runtime-images.js');
            const result = await promote({
              github,
              context: { ...context, repo: context.repo, runAttempt: process.env.GITHUB_RUN_ATTEMPT },
              record: recordFromEnv(process.env),
            });
            core.info(JSON.stringify(result));

      # Only successful PR publication (including a verified duplicate) makes a
      # revision handled. A failed promotion stays red and is retried next time.
      - name: Write promoted state
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          mkdir -p /tmp/nightly-compatibility
          echo "$SHA" > /tmp/nightly-compatibility/upstream-sha

      - name: Preserve promoted state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-compatibility-promoted-${{ needs.resolve.outputs.sha }}
          path: /tmp/nightly-compatibility/upstream-sha
          retention-days: 90
          overwrite: true # A rerun may replace this run's existing checkpoint.
          if-no-files-found: error
