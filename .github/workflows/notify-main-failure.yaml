name: Notify main failure

# Send a Slack alert (#team-multigres) when any workflow run on the main
# branch fails or times out, for any reason. This includes runner crashes,
# skipped jobs and startup failures, which a step inside the workflow cannot
# report.
#
# Notes:
# - "*" covers every workflow, including new ones. This workflow is excluded
#   by name, so it cannot trigger itself.
# - The "Coverage comment" workflow is excluded by name. Another workflow
#   triggers it (workflow_run), and GitHub gives it the branch of the run
#   that triggered it. A failed PR run can then look like a failure on main.
#   If you rename it, update the condition below. Other workflow_run
#   workflows can have the same problem. Add them here if they alert falsely.
# - Cancelled runs do not alert. Superseded runs cancel often.
# - This workflow runs with secrets. It must never check out or run code from
#   the triggering run. It only reads the event payload.
# - It runs only from the default branch, so test it after it is merged.

on: # zizmor: ignore[dangerous-triggers] Never checks out or runs code from the triggering run; it only reads event fields through env.
  workflow_run:
    workflows: ["*"]
    types: [completed]

permissions: {}

jobs:
  notify:
    name: Notify Slack
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.event.workflow_run.name != 'Notify main failure' &&
      github.event.workflow_run.name != 'Coverage comment' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["failure", "timed_out"]'), github.event.workflow_run.conclusion)
    steps:
      - name: Post failure to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          COMMIT_TITLE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then echo "No webhook configured, skipping"; exit 0; fi

          sha_short="${HEAD_SHA:0:7}"
          # Use only the first line of the commit message. It is not trusted
          # (for example, a PR title), so the jq filter escapes the Slack
          # control characters before it goes into the mrkdwn block.
          title="${COMMIT_TITLE%%$'\n'*}"

          case "$CONCLUSION" in
            timed_out) verb="timed out" ;;
            *) verb="failed" ;;
          esac

          payload=$(jq -n \
            --arg name "$WORKFLOW_NAME" \
            --arg verb "$verb" \
            --arg event "$TRIGGER_EVENT" \
            --arg url "$RUN_URL" \
            --arg attempt "$RUN_ATTEMPT" \
            --arg sha "$sha_short" \
            --arg title "$title" \
            '{
              blocks: [
                {type: "header", text: {type: "plain_text", text: (":rotating_light: " + $name + " " + $verb + " on main")}},
                {type: "section", text: {type: "mrkdwn", text: ("Trigger: `" + $event + "`, commit `" + $sha + "`, attempt " + $attempt + "\n" + ($title | gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;")))}},
                {type: "section", text: {type: "mrkdwn", text: ("<" + $url + "|View CI run>")}}
              ]
            }')

          curl -sf -X POST -H 'Content-type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
