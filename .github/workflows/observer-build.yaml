name: Observer Docker build

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"

permissions:
  contents: read

concurrency:
  group: observer-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  observer-build:
    name: Build observer image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build observer image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tools/observer/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=observer-build
          cache-to: type=gha,mode=max,scope=observer-build
