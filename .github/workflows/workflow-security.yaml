name: Workflow security

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Workflow security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned actionlint
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
      - name: Check workflow syntax and expressions
        # Shell security is covered by zizmor; avoid depending on the runner's
        # changing ShellCheck version for unrelated shell-style diagnostics.
        run: '"$RUNNER_TEMP/actionlint" -shellcheck=""'
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: v1.32.0
          inputs: .github
          online-audits: false
          advanced-security: false
          min-severity: low
      - name: Exercise workflow trust boundaries
        run: node --test scripts/workflow-security.test.js
