name: End-to-end tests

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (defaults to the triggering ref)
        default: ''
        required: false
        type: string
      timeout-minutes:
        description: Timeout for the e2e test job
        default: 20
        required: false
        type: number
      test-spec:
        description: >
          Comma-separated list of test names to run (e.g. "minimal,inline").
          Empty string runs all tests.
        default: ''
        required: false
        type: string
      mode:
        description: 'Test mode: "shared" (one cluster, fast) or "dedicated" (one cluster per test)'
        default: 'shared'
        required: false
        type: string
      operator-image-artifact:
        description: >
          Name of an uploaded artifact containing operator-image.tar.
          When set, the image is loaded from the artifact instead of being built locally.
        default: ''
        required: false
        type: string
      # Component image overrides are deliberately independent. Callers can
      # replace the whole data plane (nightly compatibility), selected
      # components (version-skew), or only postgres (custom Postgres builds).
      # An empty input leaves that component unset in the test CR, so the
      # checked-out operator applies its compiled-in default. Non-empty values
      # must be fully qualified OCI references with either a tag or sha256 digest.
      postgres-image:
        description: Fully qualified postgres/pgctld OCI image override
        default: ''
        required: false
        type: string
      multiadmin-image:
        description: Fully qualified multiadmin OCI image override
        default: ''
        required: false
        type: string
      multiadmin-web-image:
        description: Fully qualified multiadmin-web OCI image override
        default: ''
        required: false
        type: string
      multiorch-image:
        description: Fully qualified multiorch OCI image override
        default: ''
        required: false
        type: string
      multipooler-image:
        description: Fully qualified multipooler OCI image override
        default: ''
        required: false
        type: string
      multigateway-image:
        description: Fully qualified multigateway OCI image override
        default: ''
        required: false
        type: string

permissions:
  contents: read

jobs:
  e2e:
    name: "E2E (${{ inputs.test-spec || 'all' }})"
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod
          cache: false

      - name: Restore Go build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-e2e-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-e2e-${{ runner.os }}-

      - name: Verify e2e fixtures and helpers
        run: go test -tags=e2e ./test/e2e/framework -count=1

      - name: Install Kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true

      - name: Download operator image
        if: inputs.operator-image-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.operator-image-artifact }}
          path: /tmp

      - name: Load operator image from artifact
        if: inputs.operator-image-artifact != ''
        run: docker load -i /tmp/operator-image.tar

      # This source-level override keeps `ref: <old-operator-commit>` useful:
      # refs predating E2E_* support still compile the requested runtime images
      # into the operator. Current refs also apply the same values to test CRs.
      - name: Apply runtime image overrides
        env:
          POSTGRES_IMAGE: ${{ inputs.postgres-image }}
          MULTIADMIN_IMAGE: ${{ inputs.multiadmin-image }}
          MULTIADMIN_WEB_IMAGE: ${{ inputs.multiadmin-web-image }}
          MULTIORCH_IMAGE: ${{ inputs.multiorch-image }}
          MULTIPOOLER_IMAGE: ${{ inputs.multipooler-image }}
          MULTIGATEWAY_IMAGE: ${{ inputs.multigateway-image }}
        run: |
          validate_image() {
            local image="$1"
            [ -z "$image" ] ||
              [[ "$image" =~ ^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._/-]+(:[A-Za-z0-9_][A-Za-z0-9._-]{0,127}|@sha256:[0-9a-f]{64})$ ]] ||
              {
                echo "::error::Invalid OCI image reference"
                return 1
              }
          }

          replace_default() {
            local constant="$1"
            local image="$2"
            [ -n "$image" ] || return 0
            local escaped="${image//&/\\&}"
            sed -i -E \
              "s|(${constant}[[:space:]]*=[[:space:]]*\")[^\"]+\"|\\1${escaped}\"|" \
              api/v1alpha1/image_defaults.go
            grep -F "${constant} = \"${image}\"" api/v1alpha1/image_defaults.go
          }

          validate_image "$POSTGRES_IMAGE"
          validate_image "$MULTIADMIN_IMAGE"
          validate_image "$MULTIADMIN_WEB_IMAGE"
          validate_image "$MULTIORCH_IMAGE"
          validate_image "$MULTIPOOLER_IMAGE"
          validate_image "$MULTIGATEWAY_IMAGE"

          replace_default DefaultPostgresImage "$POSTGRES_IMAGE"
          replace_default DefaultMultiadminImage "$MULTIADMIN_IMAGE"
          replace_default DefaultMultiadminWebImage "$MULTIADMIN_WEB_IMAGE"
          replace_default DefaultMultiorchImage "$MULTIORCH_IMAGE"
          replace_default DefaultMultipoolerImage "$MULTIPOOLER_IMAGE"
          replace_default DefaultMultigatewayImage "$MULTIGATEWAY_IMAGE"

      - name: Build operator image
        if: inputs.operator-image-artifact == ''
        run: make container

      - name: Pull e2e images
        run: |
          # Source overrides have already been applied. Always pull the compiled
          # defaults, including digest-pinned promotion images and the exporter.
          required_images() {
            sed -n 's/.*= "\(.*\)"$/\1/p' api/v1alpha1/image_defaults.go

            # Older checked-out frameworks still load this separate image list
            # for unset overrides. Read it from that ref, not from this workflow.
            if grep -rq 'testutil.MultigresImages' test/e2e/framework; then
              sed -n '/^var MultigresImages = \[\]string{/,/^}/s/^[[:space:]]*"\([^"]*\)".*/\1/p' \
                pkg/testutil/e2e.go
            fi
          }
          E2E_IMAGES="$(required_images | sort -u | tr '\n' ' ')" \
            make pull-e2e-images

      - name: Compute test packages
        env:
          MODE: ${{ inputs.mode }}
          TEST_SPEC: ${{ inputs.test-spec }}
        run: |
          case "$MODE" in
            shared | dedicated) ;;
            *)
              echo "::error::Mode must be 'shared' or 'dedicated'"
              exit 1
              ;;
          esac

          package_file="$RUNNER_TEMP/e2e-packages"
          : > "$package_file"
          if [ -z "$TEST_SPEC" ]; then
            go list -tags=e2e "./test/e2e/${MODE}/..." > "$package_file"
          else
            IFS=',' read -r -a tests <<< "$TEST_SPEC"
            for test_name in "${tests[@]}"; do
              [[ "$test_name" =~ ^[a-z0-9][a-z0-9_-]*$ ]] ||
                {
                  echo "::error::Invalid e2e test name"
                  exit 1
                }
              package="./test/e2e/${MODE}/${test_name}/"
              [ -d "$package" ] ||
                {
                  echo "::error::Unknown e2e test '$test_name' for mode '$MODE'"
                  exit 1
                }
              go list -tags=e2e "$package" >> "$package_file"
            done
          fi

      - name: Run e2e tests
        env:
          E2E_KEEP_CLUSTERS: never
          E2E_FAILURE_LOG_DIR: ${{ runner.temp }}/e2e-failure-logs
          E2E_POSTGRES_IMAGE: ${{ inputs.postgres-image }}
          E2E_MULTIADMIN_IMAGE: ${{ inputs.multiadmin-image }}
          E2E_MULTIADMIN_WEB_IMAGE: ${{ inputs.multiadmin-web-image }}
          E2E_MULTIORCH_IMAGE: ${{ inputs.multiorch-image }}
          E2E_MULTIPOOLER_IMAGE: ${{ inputs.multipooler-image }}
          E2E_MULTIGATEWAY_IMAGE: ${{ inputs.multigateway-image }}
          MODE: ${{ inputs.mode }}
          TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        run: |
          [[ "$TIMEOUT_MINUTES" =~ ^[0-9]+$ ]] ||
            {
              echo "::error::Timeout must be a whole number of minutes"
              exit 1
            }
          mapfile -t packages < "$RUNNER_TEMP/e2e-packages"
          [ "${#packages[@]}" -gt 0 ] ||
            {
              echo "::error::No e2e test packages selected"
              exit 1
            }

          OPERATOR_IMG="$(make -s print-img)"
          export OPERATOR_IMG
          REPO_ROOT="$GITHUB_WORKSPACE"
          export REPO_ROOT

          if [ "$MODE" != "shared" ]; then
            go test -tags=e2e "${packages[@]}" -v -count=1 \
              "-timeout=${TIMEOUT_MINUTES}m"
            exit 0
          fi

          make run-e2e-shared \
            E2E_PACKAGE_FILE="$RUNNER_TEMP/e2e-packages" \
            E2E_TIMEOUT="${TIMEOUT_MINUTES}m"

      - name: Collect Kind logs on failure
        if: failure()
        run: |
          for cluster in $(kind get clusters 2>/dev/null); do
            echo "=== Logs for cluster: $cluster ==="
            kind export logs "/tmp/kind-logs-$cluster" --name "$cluster" 2>/dev/null || true
          done

      - name: Upload Kind logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kind-logs-${{ inputs.test-spec || 'all' }}
          # Public-repository artifact: only collect from this disposable Kind
          # cluster, and never inject production credentials into E2E workloads.
          path: |
            /tmp/kind-logs-*
            ${{ runner.temp }}/e2e-failure-logs
          retention-days: 5
          if-no-files-found: ignore
