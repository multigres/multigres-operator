name: Build main

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-current
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/_reusable-build-changed.yaml

  run:
    if: github.repository == 'multigres/multigres-operator'
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-and-release.yaml
    with:
      release-tag: ${{ github.sha }}

  update-current-release:
    needs: run
    runs-on: ubuntu-latest
    concurrency:
      group: current-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download install manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: dist

      - name: Create or update current pre-release
        env:
          COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" = "$COMMIT_SHA"
          BODY="## Current Build

          **Commit:** \`$COMMIT_SHA\`
          **Updated:** \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`

          This is a rolling pre-release that tracks the latest successful build from \`main\`.
          Install manifests below include the full commit-SHA image tag and pin its digest.
          Verify the attached Sigstore bundles before applying them; see RELEASE.md.

          ### Verified installation

          Follow the [release verification instructions](https://github.com/$GH_REPO/blob/$COMMIT_SHA/RELEASE.md#verify-the-release) before applying an installer."

          # Delete existing release and tag, then recreate pointing at the new
          # commit. This is the standard pattern used by neovim, goreleaser, etc.
          # for rolling prereleases. The brief gap between delete and create is
          # acceptable — if create fails, the next main push recreates it.
          gh release delete current --yes --cleanup-tag 2>/dev/null || true

          gh release create current \
            --prerelease \
            --title "Current (latest main)" \
            --notes "$BODY" \
            --target "$COMMIT_SHA" \
            dist/*

  notify-builder:
    needs: update-current-release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Generate GitHub App token for the builder repo
        id: builder-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.BUILDER_DISPATCH_APP_ID }}
          private-key: ${{ secrets.BUILDER_DISPATCH_APP_PRIVATE_KEY }}
          owner: multigres
          repositories: multigres-operator-builder
          # repository_dispatch requires contents: write on the target repo.
          permission-contents: write

      - name: Dispatch current-release-updated
        env:
          COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ steps.builder-token.outputs.token }}
        run: |
          gh api repos/multigres/multigres-operator-builder/dispatches \
            -f event_type=current-release-updated \
            -f "client_payload[sha]=$COMMIT_SHA"

  coverage:
    name: Coverage
    permissions:
      contents: read
    uses: ./.github/workflows/_reusable-test-coverage.yaml
    with:
      COVERAGE_THRESHOLD: 70

  e2e-build:
    name: E2E build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build operator image
        run: make container
      - name: Save operator image
        run: docker save $(make -s print-img) -o /tmp/operator-image.tar
      - name: Upload operator image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: operator-image
          path: /tmp/operator-image.tar
          retention-days: 1

  e2e:
    name: "E2E (${{ matrix.test }})"
    needs: e2e-build
    strategy:
      fail-fast: false
      matrix:
        test: [minimal, inline, templated, deletion]
    permissions:
      contents: read
    uses: ./.github/workflows/_reusable-e2e.yaml
    with:
      test-spec: ${{ matrix.test }}
      mode: shared
      operator-image-artifact: operator-image
