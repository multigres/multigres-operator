name: Release contract checks

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sbom-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_release_*.py' -v
      - run: node --test scripts/release-workflow.test.js
