---
# ServiceAccount for the Prometheus instance managed by the Prometheus Operator.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
# ClusterRole: Allow Prometheus to discover scrape targets via ServiceMonitors.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
# ClusterRoleBinding: Bind prometheus SA to discovery role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: multigres-operator
---
# ClusterRoleBinding: Allow prometheus SA to read the operator's /metrics endpoint.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: multigres-operator-metrics-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: multigres-operator-metrics-reader
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: multigres-operator
---
# Prometheus: Managed instance — the Prometheus Operator creates a StatefulSet from this.
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: multigres
spec:
  serviceAccountName: prometheus
  replicas: 1
  enableFeatures:
    - exemplar-storage
    - native-histograms
  enableOTLPReceiver: true
  additionalScrapeConfigs:
    name: kubelet-cadvisor-scrape
    key: scrape-configs.yaml
  serviceMonitorSelector:
    matchLabels:
      app.kubernetes.io/name: multigres-operator
  ruleSelector:
    matchLabels:
      app.kubernetes.io/name: multigres-operator
  resources:
    requests:
      memory: 200Mi
      cpu: 100m
  retention: 12h
---
# ServiceMonitor: Tell Prometheus to scrape the operator's metrics endpoint.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: multigres-operator
  labels:
    app.kubernetes.io/name: multigres-operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: multigres-operator
  endpoints:
    - port: https
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
---
# ServiceMonitor: Scrape postgres_exporter metrics from shard pool headless Services.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shard-pool-postgres-exporter
  labels:
    app.kubernetes.io/name: multigres-operator
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app.kubernetes.io/name: multigres
      app.kubernetes.io/component: shard-pool
  endpoints:
    - port: metrics
      scheme: http
      path: /metrics
---
# Service: ClusterIP service for the managed Prometheus pods.
# The operator creates a headless "prometheus-operated" service; this provides
# a stable ClusterIP for port-forwarding and inter-service communication.
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
    prometheus: multigres
  ports:
    - port: 9090
      targetPort: 9090
      name: http
  type: ClusterIP

---
# cAdvisor supplies per-container memory usage for the topology pressure alert.
apiVersion: v1
kind: Secret
metadata:
  name: kubelet-cadvisor-scrape
stringData:
  scrape-configs.yaml: |
    - job_name: kubelet-cadvisor
      scheme: https
      metrics_path: /metrics/cadvisor
      scrape_interval: 30s
      kubernetes_sd_configs:
        - role: node
      authorization:
        credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      tls_config:
        insecure_skip_verify: true
      metric_relabel_configs:
        - source_labels: [__name__, container]
          regex: 'container_memory_working_set_bytes;etcd'
          action: keep
