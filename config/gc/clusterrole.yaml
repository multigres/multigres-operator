apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: multigres-operator
    app.kubernetes.io/component: gc
    app.kubernetes.io/managed-by: kustomize
  name: gc-role
rules:
# multigres-gc lists orphaned PVCs and deletes them, and lists pods to leave
# alone any PVC a pod still uses.
# Scoped cluster-wide because PVCs live in user namespaces.
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - list
  - delete
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - list
