apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: multigres-operator
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: multigres-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  # Admission defaulting semantics can change between operator releases. Do
  # not serve old and new webhook implementations behind the same Service.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: multigres-operator
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: multigres-operator
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
          # On by default because it cannot usefully be enabled on demand:
          # changing args rolls the Deployment, so the process holding the heap
          # under investigation is replaced by a fresh one. A slow leak takes
          # days to reappear, and after an OOMKill the evidence is already gone.
          #
          # Loopback only: the endpoint is unauthenticated, serves this
          # process's argv, and lets any caller burn CPU via
          # /debug/pprof/profile. Reach it with a port-forward, which the API
          # server authenticates and RBAC authorizes.
          - --pprof-bind-address=127.0.0.1:6060
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_SERVICE_ACCOUNT
          valueFrom:
            fieldRef:
              fieldPath: spec.serviceAccountName
        # Go derives GOMAXPROCS from the cgroup CPU quota by itself, but has no
        # equivalent for memory (golang/go#75164). Project the limit so the
        # binary can set GOMEMLIMIT from it; resourceFieldRef resolves after any
        # kustomize patch, so this cannot drift from the limit below.
        - name: MEMORY_LIMIT_BYTES
          valueFrom:
            resourceFieldRef:
              containerName: manager
              resource: limits.memory
              divisor: "1"
        image: controller:latest
        name: manager
        ports: []
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # Provisional, pending the heap and allocation profiles that
        # --pprof-bind-address now makes possible. These replace untouched
        # kubebuilder scaffold values (128Mi / 500m), not measured ones.
        #
        # The floor on the memory limit is arithmetic rather than empirical:
        # GOMEMLIMIT excludes the binary's own mapping, which is ~58MiB
        # stripped, so at 128Mi the 90% the operator hands the runtime could
        # not fit alongside it.
        #
        # No CPU limit on purpose. Five controllers run at
        # MaxConcurrentReconciles 20, and throttling the collector is the wrong
        # way to fail when GOMEMLIMIT is what keeps the process inside its
        # memory limit. A CPU limit also sets GOMAXPROCS: 500m pinned it to 2.
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - mountPath: /var/run/secrets/webhook
          name: cert-dir
      volumes:
      - name: cert-dir
        secret:
          defaultMode: 420
          secretName: multigres-webhook-certs
          optional: true # CRITICAL: Allows Pod startup even if Secret is missing initially
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
