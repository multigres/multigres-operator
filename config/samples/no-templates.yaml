apiVersion: multigres.com/v1alpha1
kind: MultigresCluster
metadata:
  name: inline
  namespace: default
spec:
  postgresPasswordSecretRef:
    name: multigres-admin-password
    key: password
  pvcDeletionPolicy:
    whenDeleted: Delete
    whenScaled: Delete
  # ----------------------------------------------------------------
  # 1. Global Components (Inline)
  # ----------------------------------------------------------------
  globalTopoServer:
    etcd:
      image: "gcr.io/etcd-development/etcd:v3.6.7"
      replicas: 3
      storage:
        size: "10Gi"
        # class: "standard"
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "200m"
          memory: "512Mi"

  multiadmin:
    spec:
      replicas: 2
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "200m"
          memory: "256Mi"

  # ----------------------------------------------------------------
  # 2. Cell Definitions (Inline)
  # ----------------------------------------------------------------
  cells:
    - name: "z1"
      zoneId: us-central1-a
      # zone: "z1"
      spec:
         multigateway:
           replicas: 2
           resources:
             requests:
               cpu: "100m"
               memory: "128Mi"
             limits:
               cpu: "200m"
               memory: "256Mi"
           # Request buffering during planned failovers. Enabled by default
           # (set enabled: false to opt out); the other fields fall back to
           # the multigateway binary defaults when omitted.
           buffer:
             enabled: true
             # Per-request cap. The binary default is 10s; gateways typically
             # perceive a planned failover for ~8-9s with a longer tail, so
             # 20s masks virtually all planned failovers.
             window: 20s
             # Session-level cap; must be >= window (binary default 20s).
             maxFailoverDuration: 20s

  # ----------------------------------------------------------------
  # 3. Database Topology (Inline)
  # ----------------------------------------------------------------
  databases:
    - name: "postgres"
      default: true
      tablegroups:
        - name: "default" # Gateway requires this name at the moment.
          default: true
          shards:
            - name: "0-inf"
              spec:
                multiorch:
                  cells:
                    - "z1"
                  resources:
                    requests:
                      cpu: "50m"
                      memory: "64Mi"
                    limits:
                      cpu: "100m"
                      memory: "128Mi"

                pools:
                  main:
                    type: "readWrite"
                    cells:
                      - "z1"
                    replicasPerCell: 5
                    storage:
                      # class: "standard"
                      size: "100Gi"
                    postgres:
                       resources:
                           requests:
                             cpu: "100m"
                             memory: "256Mi"
                           limits:
                             cpu: "500m"
                             memory: "512Mi"
                    multipooler:
                       resources:
                          requests:
                            cpu: "50m"
                            memory: "64Mi"
                          limits:
                            cpu: "200m"
                            memory: "128Mi"
