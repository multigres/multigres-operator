# Optional day-0 settings for fresh data directories.
# Replace demo values and retain the Secret while referenced: see docs/postgresql-initialization.md.
apiVersion: v1
kind: Secret
metadata:
  name: multigres-init-secrets
  namespace: default
type: Opaque
stringData:
  init-secrets.json: |
    {
      "roles": {
        "app": "change-me-app-password",
        "readonly": "change-me-readonly-password"
      },
      "database_settings": {
        "postgres": {
          "work_mem": "64MB"
        }
      }
    }
