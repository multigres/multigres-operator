apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: multigres-operator-alerts
  labels:
    app.kubernetes.io/name: multigres-operator
    app.kubernetes.io/component: monitoring
spec:
  groups:
    - name: multigres-operator.rules
      rules:
        # ── Errors ────────────────────────────────────────────────

        - alert: MultigresClusterReconcileErrors
          expr: rate(multigres_operator_reconcile_errors_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "MultigresCluster controller is failing reconciles"
            description: >-
              Controller {{ $labels.controller }} has had a non-zero reconcile
              error rate for {{ $labels.namespace }}/{{ $labels.name }} over the
              last 5 minutes (current: {{ $value | humanize }}/s).
              Inspect TopologyReady for topology errors and FailoverReady for their
              impact on automatic failover; MultigresFailoverUnavailable reports
              these failures separately at critical severity.
            runbook_url: "https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/MultigresClusterReconcileErrors.md"

        - alert: MultigresClusterDegraded
          expr: multigres_operator_cluster_info{phase!="Healthy"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "MultigresCluster {{ $labels.name }} is degraded"
            description: >-
              Cluster {{ $labels.name }} in namespace {{ $labels.namespace }}
              has been in phase "{{ $labels.phase }}" for more than 10 minutes.
            runbook_url: "https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/MultigresClusterDegraded.md"

        - alert: MultigresCellGatewayUnavailable
          expr: multigres_operator_cell_gateway_replicas{state="ready"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Cell {{ $labels.cell }} has zero ready gateway replicas"
            description: >-
              Cell {{ $labels.cell }} in namespace {{ $labels.namespace }} has
              had zero ready MultiGateway replicas for 5 minutes. Traffic
              cannot be routed to this cell.
            runbook_url: "https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/MultigresCellGatewayUnavailable.md"

        - alert: MultigresShardPoolDegraded
          expr: >-
            multigres_operator_shard_pool_replicas{state="ready"}
            <
            multigres_operator_shard_pool_replicas{state="desired"}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Shard {{ $labels.shard }} pool {{ $labels.pool }} has fewer ready replicas than desired"
            description: >-
              Pool {{ $labels.pool }} of shard {{ $labels.shard }} in namespace
              {{ $labels.namespace }} has had fewer ready replicas than desired
              for more than 10 minutes.
            runbook_url: "https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/MultigresShardPoolDegraded.md"

        - alert: MultigresWebhookErrors
          expr: rate(multigres_operator_webhook_request_total{result="error"}[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Multigres admission webhook is returning errors"
            description: >-
              The {{ $labels.operation }} webhook for {{ $labels.resource }}
              has had a non-zero error rate for the last 5 minutes
              (current: {{ $value | humanize }}/s).
            runbook_url: "https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/MultigresWebhookErrors.md"

        # ── Topology and failover ──────────────────────────────────

        - alert: MultigresTopologyQuorumUnavailable
          expr: multigres_operator_toposerver_quorum_available == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Topology unavailable for failover in {{ $labels.target_namespace }}/{{ $labels.name }}"
            description: >-
              {{ $labels.reason }}: the operator detected an etcd status error or cannot confirm quorum for one consistent etcd cluster.
              Cluster {{ $labels.cluster }} has lost verified failover protection;
              existing SQL connections may still serve traffic.
            runbook_url: "https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/TopologyHealth.md"

        - alert: MultigresTopologyHealthUnknown
          expr: >-
            (multigres_operator_toposerver_quorum_available < 0)
            or (time() - multigres_operator_toposerver_health_checked_timestamp_seconds > 120)
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Topology health observation missing for {{ $labels.target_namespace }}/{{ $labels.name }}"
            description: "Etcd quorum checks are failing or stale. Failover protection cannot be verified for cluster {{ $labels.cluster }}."
            runbook_url: "https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/TopologyHealth.md"

        - alert: MultigresTopologyMemberUnavailable
          expr: multigres_operator_toposerver_member_up == 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Etcd member {{ $labels.member }} is unavailable"
            description: >-
              Member {{ $labels.target_namespace }}/{{ $labels.member }} cannot complete
              a linearizable read. Check the quorum alert before restarting other members.
            runbook_url: "https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/TopologyHealth.md"

        - alert: MultigresTopologyBackendNearQuota
          expr: >-
            multigres_operator_toposerver_backend_bytes
            / multigres_operator_toposerver_backend_quota_bytes > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Etcd backend nearing quota on {{ $labels.member }}"
            description: >-
              Backend usage on {{ $labels.target_namespace }}/{{ $labels.member }}
              is {{ $value | humanizePercentage }} of its quota. Exhausting the quota
              blocks topology writes and puts failover protection at risk.
            runbook_url: "https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/TopologyHealth.md"

        - alert: MultigresTopologyMemoryPressure
          expr: >-
            label_replace(label_replace(
              max by (namespace, pod) (container_memory_working_set_bytes{container="etcd", pod!=""}),
              "target_namespace", "$1", "namespace", "(.+)"),
              "member", "$1", "pod", "(.+)")
            / on (target_namespace, member) group_left (cluster, name)
              (max by (cluster, name, target_namespace, member)
                (multigres_operator_toposerver_memory_limit_bytes) > 0)
            > 0.8
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Etcd memory pressure on {{ $labels.member }}"
            description: >-
              Member {{ $labels.target_namespace }}/{{ $labels.member }} is using
              {{ $value | humanizePercentage }} of its memory limit. An OOM kill
              can remove a quorum member and interrupt failover protection for {{ $labels.cluster }}.
            runbook_url: "https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/TopologyHealth.md"

        - alert: MultigresTopologyMemberOOMKilled
          expr: >-
            (time() - multigres_operator_toposerver_member_oom_timestamp_seconds < 300)
            and (multigres_operator_toposerver_member_oom_timestamp_seconds > 0)
          labels:
            severity: critical
          annotations:
            summary: "Etcd member {{ $labels.member }} was OOM-killed"
            description: "An OOM kill removed member {{ $labels.target_namespace }}/{{ $labels.member }}. Check quorum and FailoverReady for cluster {{ $labels.cluster }} before restarting another member."
            runbook_url: "https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/TopologyHealth.md"

        - alert: MultigresTopologyMemberRestarting
          expr: increase(multigres_operator_toposerver_member_restarts_total[10m]) >= 3
          labels:
            severity: warning
          annotations:
            summary: "Etcd member {{ $labels.member }} is repeatedly restarting"
            description: "Member {{ $labels.target_namespace }}/{{ $labels.member }} restarted at least three times in ten minutes. Check termination reasons, memory pressure, and quorum health."
            runbook_url: "https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/TopologyHealth.md"

        - alert: MultigresFailoverUnavailable
          expr: multigres_operator_cluster_failover_ready == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Failover protection unavailable for {{ $labels.target_namespace }}/{{ $labels.cluster }}"
            description: >-
              FailoverReady is false: {{ $labels.reason }}. Topology access or shard
              orchestrators are unavailable. SQL availability does not imply that
              automatic failover is working.
            runbook_url: "https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/TopologyHealth.md"

        - alert: MultigresFailoverHealthUnknown
          expr: >-
            (multigres_operator_cluster_failover_ready < 0)
            or (time() - multigres_operator_cluster_failover_checked_timestamp_seconds > 120)
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Failover protection unverified for {{ $labels.target_namespace }}/{{ $labels.cluster }}"
            description: "Failover observations are unknown or stale. Inspect TopologyQuorumAvailable, TopologyReady, and shard OrchReady conditions."
            runbook_url: "https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/TopologyHealth.md"

        # ── Backup & Drain ────────────────────────────────────────

        - alert: MultigresBackupStale
          expr: multigres_operator_last_backup_age_seconds > 86400
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Shard {{ $labels.shard }} backup is older than 24 hours"
            description: >-
              The most recent backup for shard {{ $labels.shard }} in cluster
              {{ $labels.cluster }} (namespace {{ $labels.namespace }}) is
              {{ $value | humanizeDuration }} old. Check backup job health.
            runbook_url: "https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/MultigresBackupStale.md"

        - alert: MultigresRollingUpdateStuck
          expr: multigres_operator_rolling_update_in_progress == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Rolling update stuck for {{ $labels.shard }}/{{ $labels.pool }}"
            description: >-
              Pool {{ $labels.pool }} of shard {{ $labels.shard }} in cell
              {{ $labels.cell }} (namespace {{ $labels.namespace }}) has been
              performing a rolling update for more than 30 minutes. Check for
              pods stuck in pending or crash-looping state.
            runbook_url: "https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/MultigresRollingUpdateStuck.md"

        - alert: MultigresDrainTimeout
          expr: rate(multigres_operator_drain_operations_total{result="timeout"}[5m]) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Drain operations are timing out for {{ $labels.shard }}"
            description: >-
              Shard {{ $labels.shard }} in cluster {{ $labels.cluster }} has
              had drain timeouts for the last 10 minutes. Pods may be stuck
              in a drain state. Check pod logs and topology server connectivity.
            runbook_url: "https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/MultigresDrainTimeout.md"

        # ── Latency ───────────────────────────────────────────────

        - alert: MultigresReconcileSlow
          expr: histogram_quantile(0.99, rate(controller_runtime_reconcile_time_seconds_bucket[5m])) > 30
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Reconcile p99 latency exceeds 30 seconds"
            description: >-
              Controller {{ $labels.controller }} p99 reconcile duration has
              exceeded 30 seconds for the last 5 minutes
              (current: {{ $value | humanize }}s).
            runbook_url: "https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/MultigresReconcileSlow.md"

        # ── Saturation ────────────────────────────────────────────

        - alert: MultigresControllerSaturated
          expr: workqueue_depth{name=~"multigrescluster|tablegroup|shard|cell|toposerver|toposerver-health"} > 50
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Controller work queue is consistently deep"
            description: >-
              The {{ $labels.name }} controller work queue has been deeper than
              50 items for more than 10 minutes. The operator cannot keep up
              with incoming events. Consider increasing MaxConcurrentReconciles.
            runbook_url: "https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/MultigresControllerSaturated.md"
