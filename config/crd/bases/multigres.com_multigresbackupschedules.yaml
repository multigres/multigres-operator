              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MultigresBackupScheduleSpec defines when to back up which
              shards.
            properties:
              backupTimeoutSeconds:
                default: 14400
                description: BackupTimeoutSeconds is copied into each attempt's timeoutSeconds.
                format: int64
                minimum: 600
                type: integer
              clusterRef:
                description: ClusterRef is the MultigresCluster whose shards are backed
                  up.
                properties:
                  name:
                    description: Name of the MultigresCluster.
                    maxLength: 63
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              failedBackupsHistoryLimit:
                default: 5
                description: FailedBackupsHistoryLimit is how many failed attempts
                  to keep.
                format: int32
                minimum: 0
                type: integer
              forcePrimary:
                description: |-
                  ForcePrimary allows the backup to run on the primary when no replica is
                  available.
                type: boolean
              retry:
                default: {}
                description: Retry controls retries within one scheduled run.
                properties:
                  backoffSeconds:
                    default: 1800
                    description: |-
                      BackoffSeconds is the minimum wait between a failed attempt finishing
                      and the next attempt being created.
                    format: int64
                    minimum: 60
                    type: integer
                  maxAttempts:
                    default: 4
                    description: |-
                      MaxAttempts is the total number of attempts per scheduled run, including
                      the first.
                    format: int32
                    maximum: 10
                    minimum: 1
                    type: integer
                type: object
              schedule:
                description: Schedule is a standard 5-field cron expression, always
                  evaluated in UTC.
                minLength: 1
                type: string
              startingDeadlineSeconds:
                default: 21600
                description: |-
                  StartingDeadlineSeconds is how late a run may start. Runs that could not
                  start within this window (for example because the operator was down)
                  are counted as missed. Retries also stop once the window has passed.
                format: int64
                minimum: 0
                type: integer
              successfulBackupsHistoryLimit:
