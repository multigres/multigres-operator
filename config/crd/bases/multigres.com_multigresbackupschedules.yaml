                      description: Active is the unfinished attempt from this schedule,
                        if any.
                      type: string
                    database:
                      minLength: 1
                      type: string
                    lastScheduleOutcome:
                      description: LastScheduleOutcome is what happened at LastScheduleTime.
                      enum:
                      - Created
                      - Skipped
                      - Missed
                      type: string
                    lastScheduleTime:
                      description: |-
                        LastScheduleTime is the most recent scheduled time the controller acted
                        on for this shard.
                      format: date-time
                      type: string
                    lastSuccessfulTime:
                      description: |-
                        LastSuccessfulTime is when the newest successful attempt from this
                        schedule completed.
                      format: date-time
                      type: string
                    missedRuns:
                      description: |-
                        MissedRuns counts runs that could not start within
                        startingDeadlineSeconds.
                      format: int64
                      type: integer
                    nextScheduleTime:
                      description: NextScheduleTime is the next time a run is due.
                      format: date-time
                      type: string
                    shard:
                      minLength: 1
                      type: string
                    skippedRuns:
                      description: |-
                        SkippedRuns counts runs skipped because an unfinished backup of the same
