    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MultigresBackupSchedule creates MultigresBackup attempts on a
          cron schedule.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
