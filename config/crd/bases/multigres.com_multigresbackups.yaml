            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MultigresBackupSpec describes one backup attempt. It is immutable.
            properties:
              attempt:
                default: 1
                description: Attempt is the attempt number within the scheduled run.
                format: int32
                minimum: 1
                type: integer
              clusterRef:
