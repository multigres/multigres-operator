version = "2"

[linters]
enable = [ "gosec" ]

[linters.exclusions]
# TODO: controller-runtime 0.25.0 deprecated these APIs in favor of
# client.Client.Apply()/SubResource().Apply(), the generic admission.Defaulter/
# Validator webhook interfaces, and hand-rolled scheme registration. Tracked
# for a dedicated follow-up migration; excluded here so the dependency bump
# that introduced the deprecations isn't blocked on an unrelated,
# wide-reaching refactor.
#
# The optional package-path prefix is there because staticcheck names the
# symbol differently across versions: bare ("client.Apply") before
# golangci-lint v2.13, fully qualified ("sigs.k8s.io/.../pkg/client.Apply")
# from it.
rules = [
  { linters = [ "staticcheck" ], text = 'SA1019: (\S+/)?client\.Apply is deprecated' },
  { linters = [ "staticcheck" ], text = 'SA1019: (\S+/)?scheme\.Builder is deprecated' },
  { linters = [ "staticcheck" ], text = 'SA1019: (\S+/)?webhook\.CustomDefaulter is deprecated' },
  { linters = [ "staticcheck" ], text = 'SA1019: (\S+/)?webhook\.CustomValidator is deprecated' },
  { linters = [ "staticcheck" ], text = "WithCustomDefaulter is deprecated" },
  { linters = [ "staticcheck" ], text = "WithCustomValidator is deprecated" },
  { linters = [ "staticcheck" ], text = "GetEventRecorderFor is deprecated" },
]

[formatters]
enable = [ "gofumpt", "golines" ]
