apiVersion: v1
kind: Secret
metadata:
  name: multigres-admin-password
  namespace: default
type: Opaque
stringData:
  password: postgres
---
apiVersion: multigres.com/v1alpha1
kind: MultigresCluster
metadata:
  name: tolerations-affinity
  namespace: default
spec:
  postgresPasswordSecretRef:
    name: multigres-admin-password
    key: password
  pvcDeletionPolicy:
    whenDeleted: Delete
    whenScaled: Delete
  logLevels:
    pgctld: "debug"
    multipooler: "debug"
    multiorch: "debug"
    multiadmin: "debug"
    multigateway: "debug"
  cells:
    - name: "us-central1-a"
      zoneId: "us-central1-a"
      spec:
        multigateway:
          replicas: 1
  databases:
    - name: "postgres"
      default: true
      tablegroups:
        - name: "default"
          default: true
          shards:
            - name: "0-inf"
              spec:
                multiorch:
                  replicas: 1
                pools:
                  main-rw:
                    type: readWrite
                    cells: ["us-central1-a"]
                    replicasPerCell: 4
                    storage:
                      size: "5Gi"
                    tolerations:
                      - key: "test-toleration"
                        operator: "Equal"
                        value: "true"
                        effect: "NoSchedule"
                    affinity:
                      podAntiAffinity:
                        preferredDuringSchedulingIgnoredDuringExecution:
                          - weight: 50
                            podAffinityTerm:
                              labelSelector:
                                matchLabels:
                                  multigres.com/pool: "main-rw"
                              topologyKey: "kubernetes.io/hostname"
