apiVersion: v1
kind: Secret
metadata:
  name: multigres-admin-password
  namespace: default
type: Opaque
stringData:
  password: postgres
---
apiVersion: multigres.com/v1alpha1
kind: MultigresCluster
metadata:
  name: observability-custom
  namespace: default
spec:
  postgresPasswordSecretRef:
    name: multigres-admin-password
    key: password
  pvcDeletionPolicy:
    whenDeleted: Delete
    whenScaled: Delete
  observability:
    otlpEndpoint: "http://my-otel-collector:4318"
    otlpProtocol: "http/protobuf"
    tracesExporter: "otlp"
    metricsExporter: "otlp"
    logsExporter: "otlp"
    tracesSampler: "multigres_custom"
    samplingConfigRef:
      name: "custom-sampler-config"
  logLevels:
    pgctld: "debug"
    multipooler: "debug"
    multiorch: "debug"
    multiadmin: "debug"
    multigateway: "debug"
  cells:
    - name: "us-central1-a"
      zoneId: "us-central1-a"
      spec:
        multigateway:
          replicas: 1
  databases:
    - name: "postgres"
      default: true
      tablegroups:
        - name: "default"
          default: true
          shards:
            - name: "0-inf"
              spec:
                multiorch:
                  replicas: 1
                pools:
                  main-rw:
                    type: readWrite
                    cells: ["us-central1-a"]
                    replicasPerCell: 4
                    storage:
                      size: "5Gi"
