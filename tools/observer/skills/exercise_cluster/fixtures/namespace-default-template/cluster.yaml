apiVersion: v1
kind: Secret
metadata:
  name: multigres-admin-password
  namespace: default
type: Opaque
stringData:
  password: postgres
---
apiVersion: multigres.com/v1alpha1
kind: MultigresCluster
metadata:
  name: ns-default-template
  namespace: default
spec:
  postgresPasswordSecretRef:
    name: multigres-admin-password
    key: password
  pvcDeletionPolicy:
    whenDeleted: Delete
    whenScaled: Delete
  logLevels:
    pgctld: "debug"
    multipooler: "debug"
    multiorch: "debug"
    multiadmin: "debug"
    multigateway: "debug"
  cells:
    - name: "us-east-1"
      zoneId: "us-central1-a"
      spec:
        multigateway:
          replicas: 1
  databases:
    - name: "postgres"
      default: true
      tablegroups:
        - name: "default"
          default: true
          shards:
            - name: "0-inf"
              overrides:
                pools:
                  main-rw:
                    cells: ["us-east-1"]
