# Published runtime from operator #768, including static-leader backups (#1584).
# Upstream revision: 56439a46025bdf7d7f94f4f96152f5b4f7d57eb6.
# E2E_* image overrides take precedence for nightly candidate qualification.
apiVersion: multigres.com/v1alpha1
kind: MultigresCluster
metadata:
  name: lite
spec:
  mode: lite
  issuerName: topo-e2e-ca
  internalTLS: {enabled: true}
  postgresPasswordSecretRef: {name: multigres-admin-password, key: password}
  images:
    multipooler: ghcr.io/multigres/multigres@sha256:63149ea8d47ecb1924d2831ef7ac2a6776fb0aed495c2804d31b09e513f82079
    postgres: ghcr.io/multigres/pgctld@sha256:4761c0ed8482ed2d6109db2fdb1652045f374cd1266dbaae56898b311dcf9094
    multiadmin: ghcr.io/multigres/multigres@sha256:63149ea8d47ecb1924d2831ef7ac2a6776fb0aed495c2804d31b09e513f82079
  globalTopoServer:
    external:
      endpoints: ["https://external-etcd:2379"]
      caSecret: external-etcd-client
      clientCertSecret: external-etcd-client
  multiadmin:
    spec: {replicas: 0}
  multiadminWeb:
    spec: {replicas: 0}
  cells:
  - name: z1
    zoneId: us-central1-a
  backup:
    type: filesystem
    filesystem:
      path: /backups
      storage: {size: 2Gi, accessModes: [ReadWriteOnce]}
  databases:
  - name: postgres
    default: true
    tablegroups:
    - name: default
      default: true
      shards:
      - name: 0-inf
        spec:
          pools:
            main:
              type: readWrite
              cells: [z1]
              replicasPerCell: 1
              storage: {size: 2Gi, accessModes: [ReadWriteOnce]}
              postgres:
                resources:
                  requests: {cpu: 100m, memory: 256Mi}
                  limits: {memory: 512Mi}
              multipooler:
                resources:
                  requests: {cpu: 100m, memory: 128Mi}
                  limits: {memory: 512Mi}
