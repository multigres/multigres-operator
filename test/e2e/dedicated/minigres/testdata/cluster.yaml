# Qualified upstream revision: d063d0b437dac1fb935e0476c142f1a42a2af9f1.
# E2E_* image overrides take precedence for nightly candidate qualification.
apiVersion: multigres.com/v1alpha1
kind: MultigresCluster
metadata:
  name: lite
spec:
  mode: lite
  issuerName: topo-e2e-ca
  internalTLS: {enabled: true}
  postgresPasswordSecretRef: {name: multigres-admin-password, key: password}
  images:
    multipooler: ghcr.io/multigres/multigres@sha256:dfb55d04c2837fb926cedd496f51bb6b79408ad077e05de6c3c1591ab7c819dc
    postgres: ghcr.io/multigres/pgctld@sha256:0d575779d24c1f840123658c8c78bdd1e33e511b1e4fedd4fd4ba76fe2f4e5fc
    multiadmin: ghcr.io/multigres/multigres@sha256:dfb55d04c2837fb926cedd496f51bb6b79408ad077e05de6c3c1591ab7c819dc
  globalTopoServer:
    external:
      endpoints: ["https://external-etcd:2379"]
      caSecret: external-etcd-client
      clientCertSecret: external-etcd-client
  multiadmin:
    spec: {replicas: 0}
  multiadminWeb:
    spec: {replicas: 0}
  cells:
  - name: z1
    zoneId: us-central1-a
  backup:
    type: filesystem
    filesystem:
      path: /backups
      storage: {size: 2Gi, accessModes: [ReadWriteOnce]}
  databases:
  - name: postgres
    default: true
    tablegroups:
    - name: default
      default: true
      shards:
      - name: 0-inf
        spec:
          pools:
            main:
              type: readWrite
              cells: [z1]
              replicasPerCell: 1
              storage: {size: 2Gi, accessModes: [ReadWriteOnce]}
              postgres:
                resources:
                  requests: {cpu: 100m, memory: 256Mi}
                  limits: {memory: 512Mi}
              multipooler:
                resources:
                  requests: {cpu: 100m, memory: 128Mi}
                  limits: {memory: 512Mi}
